plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Only the Fabric API modules the client game tests need, not the whole API: its renderer (fabric-renderer-api-v1
// and Indigo) meshes the level's blocks in place of ModelBlockRenderer, with its own ambient occlusion, and other
// modules hook vanilla's rendering, registries and networking too. The oracle has to be vanilla (TESTING.md).
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
    implementation fabricApi.module("fabric-networking-api-v1", project.fabric_api_version)
    implementation fabricApi.module("fabric-resource-loader-v1", project.fabric_api_version)
    implementation fabricApi.module("fabric-api-base", project.fabric_api_version)
}

// tools/oracle_client.py passes the scenario, output directory and optional server as -Poracle.*, and the graphics
// backend (`--backend`, OpenGL unless it says vulkan, TESTING.md "Backends")
loom {
    runs {
        oracle {
            client()
            configName = 'Oracle'
            runDir = 'run'
            ideConfigGenerated = false
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=rustcraft-oracle'
            vmArg "-Drustcraft.oracle.scenario=${findProperty('oracle.scenario') ?: ''}"
            vmArg "-Drustcraft.oracle.out=${findProperty('oracle.out') ?: ''}"
            vmArg "-Drustcraft.oracle.server=${findProperty('oracle.server') ?: ''}"
            vmArg "-Drustcraft.oracle.serverReady=${findProperty('oracle.serverReady') ?: ''}"
            vmArg "-Drustcraft.oracle.ping=${findProperty('oracle.ping') ?: ''}"
            programArgs '--username', 'rustcraft', '--graphicsBackend', findProperty('oracle.backend') ?: 'opengl'
        }
    }
}

processResources {
    def version = project.version
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
