name: CI

on:
  pull_request:

jobs:
  glx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils
      - run: dpkg -l | grep -E "mesa|xvfb|xserver" | awk '{print $2, $3}'
      - run: xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -B || true
      - run: xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -v 2>&1 | grep -i -E "srgb|GLX version|server glx vendor" | head -20 || true
      - run: xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -v 2>&1 | grep -c "Visual ID" || true
      - run: |
          mkdir -p vanilla/26.3 vanilla/libraries/org/lwjgl/lwjgl-sdl/3.4.3
          curl -sSL -o vanilla/libraries/org/lwjgl/lwjgl-sdl/3.4.3/lwjgl-sdl-3.4.3-natives-linux.jar https://libraries.minecraft.net/org/lwjgl/lwjgl-sdl/3.4.3/lwjgl-sdl-3.4.3-natives-linux.jar || true
          ls -la vanilla/libraries/org/lwjgl/lwjgl-sdl/3.4.3/
      - run: python3 tools/setup_vanilla.py --skip-decompile
      - run: cargo build --bin rustcraft
      - run: LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEO_DRIVER=x11 xvfb-run -a -s "-screen 0 1280x1024x24" ./target/debug/rustcraft --device-info || true
      - run: LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEO_DRIVER=x11 GALLIUM_DRIVER=llvmpipe __GLX_VENDOR_LIBRARY_NAME=mesa xvfb-run -a -s "-screen 0 1280x1024x24" ./target/debug/rustcraft --device-info || true
      - run: LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEO_DRIVER=x11 SDL_VIDEO_FORCE_EGL=1 xvfb-run -a -s "-screen 0 1280x1024x24" ./target/debug/rustcraft --device-info || true
