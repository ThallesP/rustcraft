name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Xvfb and Mesa's llvmpipe, which tests/opengl_frame.rs renders with, like the oracle client.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Mojang's jars and libraries and the JDK only change with the pinned version. Goldens are
      # regenerated every run, so they stay out of the cache.
      - uses: actions/cache@v6
        with:
          path: |
            vanilla
            !vanilla/*/golden
            !vanilla/*/golden-classes
          key: vanilla-${{ hashFiles('MINECRAFT_VERSION', 'tools/setup_vanilla.py') }}
      - run: python3 tools/setup_vanilla.py --skip-decompile
      - run: python3 tools/golden.py
      - run: python3 tools/hotspot_port_check.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
