name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Xvfb and Mesa's llvmpipe (GLX and EGL), which tests/opengl_frame.rs renders with, like the oracle client; gdb for the
      # stall check's thread dump when the client hangs.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 gdb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The port has to keep compiling for a Mac (the steps after clippy).
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Mojang's jars and libraries and the JDK only change with the pinned version. Goldens are
      # regenerated every run, so they stay out of the cache.
      - uses: actions/cache@v6
        with:
          path: |
            vanilla
            !vanilla/*/golden
            !vanilla/*/golden-classes
          key: vanilla-${{ hashFiles('MINECRAFT_VERSION', 'tools/setup_vanilla.py') }}
      - run: python3 tools/setup_vanilla.py --skip-decompile
      # The chunk goldens decode the chunks a vanilla server sends a client joining the walk scenario's world. CI has no
      # oracle captures, so it records that server with the port's own client (the chunk bytes are the server's either
      # way), and the golden harness reads its capture instead of vanilla/<version>/oracle/walk/capture.jsonl. The
      # port's run also replays the walk on the server, whose trace and packets the replay tests check against vanilla's
      # digests.
      # The walk takes screenshots, which the port renders offscreen under xvfb-run (see the tests' note on EGL below).
      - run: python3 tools/port_client.py capture walk --accept-eula
        env:
          SDL_VIDEO_FORCE_EGL: "1"
      # The falls scenario waits for the server's answers to its landings, which its replay test takes from a capture
      # (TESTING.md, "The server's answers"): the port's own, here, whose trace and packets are checked too.
      - run: python3 tools/port_client.py capture falls --accept-eula
      # The live client on a generated world (TESTING.md, "Soak"): teleports through biomes, a village and caves, failing on
      # any panic or unported code in the client's log. It renders every frame in a window under xvfb-run (`--render`), so
      # the renderer sees every block, biome and fluid there too.
      - run: python3 tools/port_client.py soak --preset normal --accept-eula --seconds-per-stop 5 --render
        env:
          SDL_VIDEO_FORCE_EGL: "1"
      # The game thread stalled for 40 seconds on a live server (TESTING.md, "Stalls"): the connection's own thread answers
      # the keep-alives meanwhile, like vanilla's Netty thread, so the client stays connected.
      - run: python3 tools/port_client.py stall --accept-eula
      - run: python3 tools/golden.py
        env:
          RUSTCRAFT_CHUNK_CAPTURE: ${{ github.workspace }}/target/oracle/walk/capture.jsonl
      - run: python3 tools/hotspot_port_check.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # macOS, with no Mac to run on (the minutes of a macOS runner count ten times): Apple Silicon's build passes
      # clippy, tests included, and Intel's compiles.
      - run: cargo clippy --target aarch64-apple-darwin --workspace --all-targets -- -D warnings
      - run: cargo check --target x86_64-apple-darwin --workspace
      # tests/opengl_frame.rs renders under xvfb-run. Xvfb's GLX visuals come from Mesa's dril, which asks the GPU's DRM
      # node for its configs through GBM; a machine without one (this runner, a container) gets dril's fixed list, which
      # has no sRGB-capable visual for the framebuffer vanilla asks for, so SDL finds no GLX visual. SDL's EGL path, on
      # the same Xvfb and llvmpipe, takes it. The oracle machine has a DRM node, and its Xvfb takes GLX, like vanilla.
      # This runner's Mesa (25.2) isn't the oracle's, so here the frames only have to render: the job below checks their
      # pixels.
      - run: cargo test --workspace
        env:
          SDL_VIDEO_FORCE_EGL: "1"

  # The frames' pixels, on the driver vanilla's screenshots were taken on: Ubuntu 26.04 with Mesa 26.0.8-1ubuntu0.3's
  # llvmpipe on LLVM 21.1.8 (TESTING.md, "Screenshots"). Ubuntu's archive is read as snapshot.ubuntu.com froze it on
  # 2026-10-23, and the packages that render are pinned to the oracle machine's versions, so a later Mesa in the archive
  # changes nothing here. RUSTCRAFT_ORACLE_DRIVER=1 makes tests/opengl_frame.rs check every digest it has, failing
  # where it can't: the offline spawn view, and the screenshots of the port's live runs below.
  frames:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      SNAPSHOT: 20261023T000000Z
      MESA: 26.0.8-1ubuntu0.3
      RUSTCRAFT_ORACLE_DRIVER: "1"
      SDL_VIDEO_FORCE_EGL: "1"
    steps:
      # The snapshot service is https, so the certificates come first, from the archive as it is.
      - run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates
          apt-get update --snapshot "$SNAPSHOT"
          apt-get install -y --no-install-recommends --snapshot "$SNAPSHOT" \
            git curl gcc libc6-dev python3 zstd xauth xvfb=2:21.1.22-1ubuntu1.3 libgl1 libegl1 \
            mesa-libgallium="$MESA" libgl1-mesa-dri="$MESA" libglx-mesa0="$MESA" libegl-mesa0="$MESA" \
            libgbm1="$MESA" libllvm21=1:21.1.8-6ubuntu1
        env:
          DEBIAN_FRONTEND: noninteractive
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: |
            vanilla
            !vanilla/*/golden
            !vanilla/*/golden-classes
          key: vanilla-${{ hashFiles('MINECRAFT_VERSION', 'tools/setup_vanilla.py') }}
      - run: python3 tools/setup_vanilla.py --skip-decompile
      # The port's runs of the scenarios whose screenshots it matches, each on a fresh vanilla server.
      - run: |
          for scenario in walk-no-gui walk sky-sunset sky-night sky-sunrise; do
            python3 tools/port_client.py capture "$scenario" --accept-eula
          done
      - run: cargo test --release --test opengl_frame
        env:
          RUSTCRAFT_CHUNK_CAPTURE: ${{ github.workspace }}/target/oracle/walk-no-gui/capture.jsonl
      # The port's runs (screenshots, client logs, captures), to compare with vanilla's when a digest differs here.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: port-runs
          path: target/oracle
