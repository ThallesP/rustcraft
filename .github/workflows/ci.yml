name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Xvfb and Mesa's llvmpipe (GLX and EGL), which tests/opengl_frame.rs renders with, like the oracle client.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Mojang's jars and libraries and the JDK only change with the pinned version. Goldens are
      # regenerated every run, so they stay out of the cache.
      - uses: actions/cache@v6
        with:
          path: |
            vanilla
            !vanilla/*/golden
            !vanilla/*/golden-classes
          key: vanilla-${{ hashFiles('MINECRAFT_VERSION', 'tools/setup_vanilla.py') }}
      - run: python3 tools/setup_vanilla.py --skip-decompile
      # The chunk goldens decode the chunks a vanilla server sends a client joining the walk scenario's world. CI has no
      # oracle captures, so it records that server with the port's own client (the chunk bytes are the server's either
      # way), and the golden harness reads its capture instead of vanilla/<version>/oracle/walk/capture.jsonl. The
      # port's run also replays the walk on the server, whose trace and packets the replay tests check against vanilla's
      # digests.
      - run: python3 tools/port_client.py capture walk --accept-eula
      - run: python3 tools/golden.py
        env:
          RUSTCRAFT_CHUNK_CAPTURE: ${{ github.workspace }}/target/oracle/walk/capture.jsonl
      - run: python3 tools/hotspot_port_check.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # tests/opengl_frame.rs renders under xvfb-run. On this runner's Xvfb (xserver 21.1.12, Mesa 25.2) SDL finds no
      # GLX visual for the attributes vanilla asks for, though GLX itself works; SDL's EGL path, on the same Xvfb and
      # llvmpipe, does. The oracle machine's Xvfb takes GLX, like vanilla.
      - run: cargo test --workspace
        env:
          SDL_VIDEO_FORCE_EGL: "1"
