name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Mojang's jars and libraries and the JDK only change with the pinned version.
      - uses: actions/cache@v6
        with:
          path: vanilla
          key: vanilla-${{ hashFiles('MINECRAFT_VERSION', 'tools/setup_vanilla.py') }}
      - run: python3 tools/setup_vanilla.py --skip-decompile
      - run: python3 tools/golden.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
