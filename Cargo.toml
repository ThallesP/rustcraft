[workspace]
members = [".", "tools/packet-proxy", "tools/oracle-diff"]

[package]
name = "rustcraft"
version = "0.1.0"
edition = "2024"
description = "Minecraft Java Edition client, ported to Rust"
publish = false

[dependencies]
flate2 = "1"
glow = "0.17"
libc = "0.2"
libloading = "0.8"
md-5 = "0.10"
miniz_oxide = "0.8"
png = "0.18"
serde_json = "1"

# The port itself stays unoptimized with overflow checks, so an int overflow that Java would
# wrap panics in the golden tests instead of passing silently. Dependencies are optimized.
# Debug info is line tables only, enough for backtraces: full debug info made each track's
# target directory 5 to 10 GB on a shared disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The build to play and to benchmark at its best: fat LTO over one codegen unit, which took 7 to
# 10% fewer cycles than `release` in the offline benchmark (`--benchLevel`) and 9 to 14% less CPU
# in its section compiles (PROGRESS.md, 2026-10-24), but two and a half times as long to build.
# `release` keeps the default, since every track's live checks build it on a shared machine.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
